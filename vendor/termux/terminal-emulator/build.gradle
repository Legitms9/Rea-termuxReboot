plugins {
    id 'com.android.library'
}

android {
    namespace 'com.termux.terminal'
    compileSdk rootProject.ext.reaCompileSdk
    ndkVersion rootProject.ext.reaNdkVersion

    defaultConfig {
        minSdk rootProject.ext.reaMinSdk
        targetSdk rootProject.ext.reaTargetSdk

        externalNativeBuild {
            ndkBuild {
                // no -Werror: newer NDKs add warnings upstream didn't have to satisfy
                cFlags "-std=c11", "-Wall", "-Wextra", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
