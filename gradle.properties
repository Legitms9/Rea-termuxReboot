org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# IMPORTANT: applicationId length invariant.
#
# Termux bootstrap binaries have the prefix "/data/data/com.termux/files/usr"
# compiled into their ELF rodata. We do NOT recompile 400+ packages. Instead we
# require the applicationId to be exactly as long as "com.termux" (10 chars) so
# the packaged prefix can be rewritten in place, byte for byte, at build time.
#
#   /data/data/com.termux/files/usr   (31 bytes)
#   /data/data/io.rea.ide/files/usr  (31 bytes)
#
# scripts/check_app_id.py enforces this in CI.
# ---------------------------------------------------------------------------
rea.applicationId=io.rea.ide
rea.termux.packageAlias=com.termux

rea.minSdk=24
rea.targetSdk=34
rea.compileSdk=34
rea.ndkVersion=26.1.10909125

# Termux bootstrap release used by the build task `prepareBootstrap`.
rea.bootstrapRelease=bootstrap-2026.11.08-r1+apt.android-7
