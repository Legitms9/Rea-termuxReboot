name: build-apk

on:
  push:
    branches: [main, 'arena/**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_bootstrap:
        description: 'Publicar os bootstraps patchados no release bootstrap-cache'
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
  REA_APP_ID: io.rea.ide
  BOOTSTRAP_RELEASE: 'bootstrap-2026.11.08-r1+apt.android-7'

jobs:
  # --------------------------------------------------------------- guardrails
  guard:
    name: invariantes do projeto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: applicationId tem o mesmo tamanho de "com.termux"
        run: python3 scripts/patch_bootstrap.py --check --app-id "$REA_APP_ID"
      - name: módulos vendorizados presentes
        run: |
          test -f vendor/termux/terminal-emulator/src/main/jni/termux.c
          test -f vendor/termux/terminal-view/src/main/java/com/termux/view/TerminalView.java
          test -f vendor/termux/TERMUX-APP-LICENSE.md

  # -------------------------------------------------------- editor web (Node)
  web:
    name: editor web (CodeMirror 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - name: build
        working-directory: web
        run: npm run build
      - name: smoke test do editor (jsdom)
        working-directory: web
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ------------------------------------------------------- termux bootstrap
  bootstrap:
    name: bootstrap termux (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: baixar, verificar e reescrever o prefixo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/prepare_bootstrap.py \
            --release "$BOOTSTRAP_RELEASE" \
            --app-id "$REA_APP_ID" \
            --abis arm64-v8a \
            --out-dir app/src/main/jniLibs \
            --cache-dir "$RUNNER_TEMP/bootstrap-cache"
      - name: validação do resultado
        run: |
          ls -la app/src/main/jniLibs/arm64-v8a
          python3 - <<'PY'
          import json, pathlib, zipfile
          p = pathlib.Path("app/src/main/jniLibs/arm64-v8a/libtermux-bootstrap.so")
          z = zipfile.ZipFile(p)
          names = z.namelist()
          m = json.loads(z.read("REA-INSTALL-MANIFEST.json"))
          print("entradas:", len(names), "| executáveis:", len(m["executables"]), "| symlinks:", len(m["symlinks"]))
          assert "bin/bash" in names and "SYMLINKS.txt" in names
          data = z.read("bin/bash")
          assert data[:4] == b"\x7fELF", "bin/bash não é ELF"
          assert b"/data/data/io.rea.ide/files/usr" in data, "prefixo não reescrito"
          assert b"/data/data/com.termux" not in data, "sobrou prefixo canônico"
          print("prefixo validado dentro de bin/bash")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-arm64-v8a
          path: app/src/main/jniLibs/arm64-v8a/libtermux-bootstrap.so
          retention-days: 7

  # ------------------------------------------------------------------- APK
  apk:
    name: apk (arm64-v8a)
    needs: [guard, web, bootstrap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - name: SDK/NDK necessários
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3

      - name: web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: bootstrap
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-arm64-v8a
          path: app/src/main/jniLibs/arm64-v8a

      - name: keystore (opcional, via secrets)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.REA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rea.jks"
            echo "file=$RUNNER_TEMP/rea.jks" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
          fi

      - name: compilar
        env:
          REA_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          REA_KEYSTORE_PASSWORD: ${{ secrets.REA_KEYSTORE_PASSWORD }}
          REA_KEY_ALIAS: ${{ secrets.REA_KEY_ALIAS }}
          REA_KEY_PASSWORD: ${{ secrets.REA_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon "${{ steps.keystore.outputs.task }}" \
            -Prea.bootstrapRelease="$BOOTSTRAP_RELEASE" \
            -Prea.webPrefetched=true \
            --stacktrace

      - name: empacotar artefato
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          cd out && ls -la && sha256sum *.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rea-ide-apk-arm64-v8a
          path: out/
          retention-days: 30
          if-no-files-found: error

  # -------------------------------------------------------------- publicação
  release:
    name: agregar APKs
    needs: [apk]
    if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rea-ide-apk-*
          merge-multiple: true
          path: all
      - run: cd all && sha256sum *.apk | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: all/*
      - uses: actions/upload-artifact@v4
        with:
          name: rea-ide-apk-all
          path: all/
          retention-days: 30

  publish-bootstrap:
    name: publicar bootstrap no release
    needs: [bootstrap]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-arm64-v8a
          path: publish/arm64-v8a
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_bootstrap.py --jni-libs publish
