name: web-preview

# Builds the editor surface as a standalone static page so the UI can be reviewed in a
# browser (and in a live preview) without an Android device.

on:
  push:
    branches: [main, 'arena/**']
    paths: ['web/**', '.github/workflows/web-preview.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - working-directory: web
        run: npm run build
      - name: harness de preview
        run: cp web/dev/preview.html web/dist/preview.html
      - working-directory: web
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: web/dist
          retention-days: 14
