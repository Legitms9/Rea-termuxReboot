# rea-config-version: 3   <- se a Codemagic mostrar outro número, ela está com cópia velha
#
# Codemagic — CI Android grátis (500 min/mês) que builda direto do GitHub,
# sem depender do GitHub Actions.
#
# IMPORTANTE: este arquivo precisa existir na branch que você manda buildar. Ele está na
# branch do PR (arena/65202ee3-rea-termuxreboot) e vai para a main quando o PR #1 for mergeado.
#
# Schema: https://codemagic.io/codemagic-schema.json
#   - `cache:` fica no NÍVEL DO WORKFLOW (não dentro de environment)
#   - environment não aceita `python:` (a imagem Ubuntu já traz python3)
#   - `linux_x2` exige billing ativo; `linux` é o runner grátis
# scripts/check_codemagic.py valida essas regras antes de você clicar em "Start build".

workflows:
  android-apk:
    name: REA IDE APK (arm64)
    instance_type: linux
    max_build_duration: 120
    environment:
      groups: []
      vars:
        REA_APP_ID: io.rea.ide
        BOOTSTRAP_RELEASE: "bootstrap-2026.11.08-r1+apt.android-7"
        ABIS: arm64-v8a
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
      java: 17
      node: 20
      ndk: 26.1.10909125
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.cache/bootstrap
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
          include: true
        - pattern: 'arena/*'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Ambiente (diagnóstico)
        script: |
          echo "branch: $CM_BRANCH  commit: $CM_COMMIT"
          echo "JAVA_HOME=${JAVA_HOME:-<vazio>}"
          java -version 2>&1 | head -2
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-<vazio>}"
          node --version
          python3 --version

      - name: invariante do applicationId
        script: python3 scripts/patch_bootstrap.py --check --app-id "$REA_APP_ID"

      - name: testes do patcher (sem rede)
        script: python3 scripts/test_prepare_bootstrap.py

      - name: editor web + testes
        script: |
          node --version || { echo "node ausente"; exit 1; }
          cd web
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: bootstrap do Termux (prefixo reescrito, sha256 verificado)
        script: |
          # Codemagic não tem o GitHub CLI: prepare_bootstrap.py cai para HTTP puro.
          # Três saídas se o download falhar (o passo seguinte valida o resultado de qualquer forma):
          #   1. REA_BOOTSTRAP_PROXY=https://ghproxy.net/https://github.com
          #   2. REA_BOOTSTRAP_MIRROR=https://seu-servidor/bootstraps
          #   3. commit do próprio zip em cache/ e --source-dir cache/ (não recomendado: 40 MB no repo)
          python3 scripts/prepare_bootstrap.py \
            --release "$BOOTSTRAP_RELEASE" \
            --app-id "$REA_APP_ID" \
            --abis "$ABIS" \
            --out-dir app/src/main/jniLibs \
            --cache-dir "$CM_BUILD_DIR/.cache/bootstrap"

      - name: validar o bootstrap (falha aqui, não no celular)
        script: |
          python3 - <<'PY'
          import json, pathlib, zipfile
          for abi in ["arm64-v8a"]:
              p = pathlib.Path(f"app/src/main/jniLibs/{abi}/libtermux-bootstrap.so")
              assert p.exists(), f"bootstrap ausente para {abi}"
              z = zipfile.ZipFile(p)
              names = z.namelist()
              data = z.read("bin/bash")
              m = json.loads(z.read("REA-INSTALL-MANIFEST.json"))
              assert data[:4] == b"\x7fELF", "bin/bash não é ELF"
              assert b"/data/data/io.rea.ide/files/usr" in data, "prefixo não reescrito"
              assert b"/data/data/com.termux" not in data, "sobrou prefixo canônico"
              assert "SYMLINKS.txt" in names and m["symlinks"], "sem symlinks (bin/sh sumiria)"
              print(f"{abi}: ok — {len(names)} entradas, {len(m['executables'])} executáveis, "
                    f"{len(m['symlinks'])} symlinks, {p.stat().st_size/1e6:.1f} MB")
          PY

      - name: Android SDK / NDK
        script: |
          # A imagem Linux da Codemagic não garante SDK Android; instalamos o cmdline-tools
          # se o sdkmanager não estiver disponível. Idempotente.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          mkdir -p "$SDK"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK"

          if ! command -v sdkmanager > /dev/null 2>&1; then
            if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
              export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
            else
              echo "instalando Android cmdline-tools em $SDK"
              curl -fsSL -o /tmp/cmdtools.zip \
                https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              mkdir -p "$SDK/cmdline-tools"
              unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
              mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
              rm -f /tmp/cmdtools.zip
              export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
            fi
          fi

          yes | sdkmanager --licenses > /dev/null || true
          NEED=""
          [ -d "$SDK/platforms/android-34" ] || NEED="$NEED platforms;android-34"
          [ -d "$SDK/build-tools/34.0.0" ] || NEED="$NEED build-tools;34.0.0"
          [ -d "$SDK/ndk/26.1.10909125" ] || NEED="$NEED ndk;26.1.10909125"
          if [ -n "$NEED" ]; then
            echo "instalando:$NEED"
            sdkmanager --install $NEED > /dev/null
          fi

          # SDK local do Gradle (e do CI): sem isso o Gradle reclama de SDK location
          echo "sdk.dir=$SDK" > local.properties
          echo "SDK=$SDK"; ls "$SDK/ndk" "$SDK/platforms" || true

      - name: build APK
        script: |
          set -e
          chmod +x gradlew || true
          # `bash ./gradlew` em vez de ./gradlew: imune a bit de execução perdido no checkout
          bash ./gradlew --no-daemon --stacktrace assembleDebug \
            -Prea.bootstrapRelease="$BOOTSTRAP_RELEASE" \
            -Prea.webPrefetched=true

      - name: conferir o APK
        script: |
          set -e
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "nenhum APK gerado"; exit 1; }
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          sha256sum "$APK" > SHA256SUMS.txt && cat SHA256SUMS.txt
          for entry in "lib/arm64-v8a/libtermux-bootstrap.so" "lib/arm64-v8a/libtermux.so"; do
            unzip -l "$APK" | grep -q "$entry" || { echo "ERRO: $entry não entrou no APK"; exit 1; }
          done
          unzip -l "$APK" | grep -q "assets/www/index.html" || {
            echo "ERRO: bundle do editor não entrou no APK"; exit 1; }

    artifacts:
      - app/build/outputs/apk/**/*.apk
      - SHA256SUMS.txt

    publishing:
      # Notificação por e-mail é opcional: crie o grupo "email" em Codemagic → Teams →
      # Environment variables com CM_EMAIL_RECIPIENT e descomente.
      # email:
      #   recipients: [${CM_EMAIL_RECIPIENT}]
      #   notify:
      #     success: true
      #     failure: true
      scripts:
        - name: resumo
          script: echo "APK disponível em Artifacts (30 dias)."
